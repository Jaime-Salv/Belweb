<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7f8">
  <meta name="description" content="Nuestra cajita privada de recuerdos.">
  <title>Nuestra cajita ❤️</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app-v2.css?v=1">
</head>
<body>
  <div id="memoryBackground" class="memory-background" aria-hidden="true"></div>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>

  <section id="authGate" class="auth-gate">
    <div class="auth-card glass">
      <div class="brand-heart">❤️</div>
      <span class="eyebrow">NUESTRA CAJITA</span>
      <h1>Bel & Jaime</h1>
      <p class="auth-copy">Un rincón privado para guardar lo que vivimos, lo que sentimos y todo lo que todavía nos queda.</p>

      <label class="field-label" for="authEmail">Correo</label>
      <input id="authEmail" class="field-control" type="email" autocomplete="email" placeholder="tu@email.com">

      <label class="field-label" for="authPassword">Contraseña</label>
      <div class="password-row">
        <input id="authPassword" class="field-control" type="password" autocomplete="current-password" minlength="8" placeholder="Tu contraseña">
        <button class="password-toggle" data-toggle-password="authPassword" type="button">Mostrar</button>
      </div>

      <button id="signInBtn" class="primary-btn full" type="button">Entrar en nuestra cajita</button>
      <div class="auth-secondary">
        <button id="forgotBtn" class="text-btn" type="button">🔑 No tengo / olvidé mi contraseña</button>
        <button id="magicBtn" class="text-btn" type="button">✉️ Entrar con enlace mágico</button>
        <button id="signUpBtn" class="text-btn subtle" type="button">Primera vez aquí · crear cuenta</button>
      </div>
      <p id="authStatus" class="status" aria-live="polite"></p>
    </div>
  </section>

  <div id="privateApp" class="app hidden">
    <aside class="sidebar glass">
      <button class="brand" data-route="home" type="button">
        <strong>Bel & Jaime ❤️</strong>
        <small>nuestra cajita de recuerdos</small>
      </button>
      <nav id="desktopNav" class="desktop-nav" aria-label="Navegación principal">
        <button data-route="home" type="button">🏠 <span>Inicio</span></button>
        <button data-route="capsules" type="button">💌 <span>Cápsulas</span></button>
        <button data-route="gallery" type="button">📷 <span>Álbum</span></button>
        <button data-route="map" type="button">🗺️ <span>Mapa</span></button>
        <button data-route="history" type="button">📖 <span>Historia</span></button>
        <button data-route="settings" type="button">⚙️ <span>Ajustes</span></button>
      </nav>
      <button id="desktopNeedBtn" class="need-btn" type="button">🫂 Te necesito</button>
      <div class="sidebar-user">
        <span id="sidebarEmoji">❤️</span>
        <div><strong id="sidebarName">Nosotros</strong><small>sesión privada</small></div>
      </div>
    </aside>

    <main class="main-shell">
      <header class="mobile-topbar">
        <button class="mobile-brand" data-route="home" type="button">Nuestra cajita ❤️</button>
        <button id="mobileProfileBtn" class="avatar-btn" data-route="settings" type="button">❤️</button>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>

    <button id="floatingNeedBtn" class="floating-need" type="button" aria-label="Te necesito">🫂</button>

    <nav class="bottom-nav glass" aria-label="Navegación móvil">
      <button data-route="home" type="button"><span>🏠</span><small>Inicio</small></button>
      <button data-route="capsules" type="button"><span>💌</span><small>Cápsulas</small></button>
      <button data-route="gallery" type="button"><span>📷</span><small>Álbum</small></button>
      <button data-route="map" type="button"><span>🗺️</span><small>Mapa</small></button>
      <button id="moreBtn" type="button"><span>•••</span><small>Más</small></button>
    </nav>
  </div>

  <div id="moreSheet" class="sheet hidden" aria-hidden="true">
    <button class="sheet-backdrop" data-close-sheet type="button" aria-label="Cerrar"></button>
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <button data-route="emergencies" type="button">🫂 <span>Te necesito</span></button>
      <button data-route="history" type="button">📖 <span>Nuestra historia</span></button>
      <button data-route="settings" type="button">⚙️ <span>Ajustes</span></button>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script type="module" src="/app-v2.js?v=1"></script>
</body>
</html>
